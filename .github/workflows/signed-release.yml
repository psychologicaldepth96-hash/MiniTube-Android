name: Signed release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MINITUBE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MINITUBE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINITUBE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MINITUBE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo "Missing release signing secrets. No release generated."; exit 1; }
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned release
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign release with private GitHub secrets
        env:
          KEYSTORE_B64: ${{ secrets.MINITUBE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MINITUBE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINITUBE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MINITUBE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/minitube-release.jks"
          export MINITUBE_STORE_PASS="$STORE_PASS"
          export MINITUBE_KEY_PASS="$KEY_PASS"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/minitube-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:MINITUBE_STORE_PASS --key-pass env:MINITUBE_KEY_PASS --out "$RUNNER_TEMP/MiniTube-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/MiniTube-release.apk"
          mkdir -p release-output
          cp "$RUNNER_TEMP/MiniTube-release.apk" release-output/
          rm -f "$RUNNER_TEMP/minitube-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: MiniTube-signed-release
          path: release-output/MiniTube-release.apk
          if-no-files-found: error
